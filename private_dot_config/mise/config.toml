[tools]
node = { version = "latest", lazy = true, minimum_release_age = "0s" }
opencode = { version = "latest", lazy = true, auto_update = "4h", minimum_release_age = "1d" }
tlrc = "latest"
ruby = "3.3.0"
usage = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["go", "node", "python", "ruby"]

[settings.upgrade]
